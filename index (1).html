<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор зворотного відсотка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: 2 sums → tap a percent button → result bar fixed at the bottom, always visible */
:root{
  --warn:#b4531a;
  --bg:#f3f4f7; --surface:#ffffff; --fg:#1b1d2a; --muted:#6b7086; --line:#e2e4ec;
  --accent:#5b3fd6; --accent-soft:#efebfd; --on-accent:#ffffff; --ok:#1f7a4d;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131a; --surface:#1b1d27; --fg:#eceef5; --muted:#9ba0b4; --line:#2c2f3d;
  --accent:#a593ff; --accent-soft:#272241; --on-accent:#14121f; --ok:#5fd39a; --warn:#f0a36b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131a; --surface:#1b1d27; --fg:#eceef5; --muted:#9ba0b4; --line:#2c2f3d;
  --accent:#a593ff; --accent-soft:#272241; --on-accent:#14121f; --ok:#5fd39a; --warn:#f0a36b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4}
.wrap{max-width:520px;margin:0 auto;padding-inline:14px;padding-block:16px 250px;display:grid;gap:14px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inputs > div{min-width:0}
label,.lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 5px 2px}
.field{position:relative}
input{width:100%;font:800 1.2rem/1.2 var(--body);font-variant-numeric:tabular-nums;color:var(--fg);background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 42px 12px 12px;outline:none}
input:focus{border-color:var(--accent)}
.unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.chip{font:inherit;text-align:left;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0}
.chip b{display:block;font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums}
.chip span{display:block;font-size:.76rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] span{color:var(--on-accent);opacity:.85}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.own{display:none;margin-top:6px}
.own.show{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.own input{font-size:1.05rem;padding:10px 40px 10px 12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px calc(14px + env(safe-area-inset-bottom, 0px));box-shadow:0 -6px 20px rgba(20,20,40,.08)}
.bar-in{max-width:520px;margin:0 auto;display:grid;gap:8px}
.sel{font-size:.8rem;font-weight:700;color:var(--muted)}
.main{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.main .big{font-size:1.7rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.main .per{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums}
.main .per small{color:var(--muted);font-weight:600}
.sub{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.sub b{color:var(--fg)}
.copy{font:700 .9rem var(--body);background:var(--accent-soft);color:var(--accent);border:0;border-radius:10px;padding:10px;cursor:pointer}
.copy.done{color:var(--ok)}
.info{font-size:.8rem;color:var(--muted);line-height:1.35}
.info b{color:var(--fg)}
.warn{font-size:.82rem;font-weight:700;color:var(--warn)}
.btns{display:grid;grid-template-columns:auto 1fr;gap:8px}
.reset{font:700 .9rem var(--body);background:transparent;color:var(--muted);border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}
.reset:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<style>body{margin:0}</style>
</head>
<body>

<div class="wrap">
  <div class="inputs">
    <div>
      <label for="price">Сума курсу</label>
      <div class="field"><input id="price" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">грн</span></div>
    </div>
    <div>
      <label for="cash">Готівка</label>
      <div class="field"><input id="cash" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">грн</span></div>
    </div>
  </div>

  <div>
    <span class="lbl">Оплата частинами · Альянс</span>
    <div class="grid" id="g-parts"></div>
  </div>
  <div>
    <span class="lbl">Кредит</span>
    <div class="grid" id="g-credit"></div>
  </div>
  <div>
    <div class="grid"><button class="chip" id="ownBtn" aria-pressed="false"><b>Інший %</b><span>вписати</span></button></div>
    <div class="own" id="own">
      <div class="field"><input id="cpct" type="text" inputmode="decimal" placeholder="14" autocomplete="off" aria-label="Відсоток"><span class="unit">%</span></div>
      <div class="field"><input id="cm" type="text" inputmode="numeric" placeholder="10" autocomplete="off" aria-label="Місяців"><span class="unit">міс</span></div>
    </div>
  </div>
</div>

<div class="bar" aria-live="polite">
  <div class="bar-in">
    <div class="sel" id="r-sel">—</div>
    <div class="main">
      <div><div class="lbl" style="margin:0">Оформлюємо на</div><div class="big" id="r-gross">—</div></div>
      <div class="per" id="r-per">—</div>
    </div>
    <div class="sub"><span>Доплата <b id="r-add">—</b></span><span>Всього з готівкою <b id="r-total">—</b></span></div>
    <div class="warn" id="r-warn" hidden></div>
    <div class="info" id="r-info" hidden></div>
    <div class="btns"><button class="reset" id="reset">Скинути</button><button class="copy" id="copy">Скопіювати для клієнта</button></div>
  </div>
</div>

<script>
// Відсотки з таблиць умов (Сенс поки не підключений)
const PARTS = Array.from({length:13}, (_, i) => ({id:'p'+i, pct:i+5, m:i+3, name:`Оплата частинами · ${i+3} пл`, label:'Оплата частинами'}));
// Умови банків: ліміти, вік, разова комісія (% від суми), СМС (once — за договір, month — щомісяця, pct — % від суми), підписання
const BANK = {
  'Альянс':        {age:'21–65', max:250000, sms:{t:'once',v:499}, sign:'офлайн + онлайн ОЧ'},
  'Юнекс':         {age:'21–65', max:100000, sms:{t:'once',v:999}, sign:'онлайн (до 35 т айді банкінг, від 35 т Дія підпис) + офлайн'},
  'Плати Пізніше': {age:'18–75', min:1000, sign:'онлайн (айді банкінг)'},
  'Суперіум':      {age:'21–65', min:3000, max:70000, onlineMax:30000, sms:{t:'none',v:0}, sign:'онлайн до 30 т + офлайн до 70 т'},
};
const CREDIT = [
  ['Альянс',3,3.5,0],['Юнекс',3,5,1],['Юнекс',5,8,2,{t:'month',v:50}],['Плати Пізніше',5,15,0,{t:'pct',v:2}],['Суперіум',5,15,0],
  ['Альянс',6,7,0],['Альянс',10,11,0],['Юнекс',10,14,6],['Плати Пізніше',10,15,7,{t:'none',v:0}]
].map(([b,m,pct,fee,sms],i) => ({id:'c'+i, pct, m, fee, ...BANK[b], sms: sms || BANK[b].sms, bank:b, name:`${b} · ${m} міс`, label:`Кредит ${b}`}));

const $ = id => document.getElementById(id);
const parse = s => parseFloat(String(s).replace(/[\s%]/g,'').replace(',', '.'));
const money = n => Math.round(n).toLocaleString('uk-UA') + ' грн';
const num = n => n.toLocaleString('uk-UA',{maximumFractionDigits:2});
const plat = n => { const t=n%10, h=n%100; return n+' '+(t===1&&h!==11?'платіж':(t>=2&&t<=4&&(h<12||h>14)?'платежі':'платежів')); };
let selected = 'p0';

function chip(o, sub){ return `<button class="chip" data-id="${o.id}" aria-pressed="false"><b>${num(o.pct)}%</b><span>${sub}</span></button>`; }
$('g-parts').innerHTML = PARTS.map(o => chip(o, `${o.m} пл`)).join('');
$('g-credit').innerHTML = CREDIT.map(o => chip(o, o.name)).join('');

function current(){
  if (selected === 'own'){
    const pct = parse($('cpct').value), m = Math.round(parse($('cm').value));
    return {pct, m: isNaN(m) ? null : m, name: 'Свій відсоток', label: 'Розтермінування'};
  }
  return [...PARTS, ...CREDIT].find(o => o.id === selected);
}

let copyText = '';
function render(){
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String((c.dataset.id || 'own') === selected)));
  $('own').classList.toggle('show', selected === 'own');
  const price = parse($('price').value);
  let cash = parse($('cash').value); if (isNaN(cash) || cash < 0) cash = 0;
  const fin = price - cash, o = current();
  const blank = msg => { $('r-sel').textContent = msg; ['r-gross','r-per','r-add','r-total'].forEach(i => $(i).textContent = '—'); $('r-warn').hidden = $('r-info').hidden = true; copyText = ''; };
  if (isNaN(price) || price <= 0) return blank('Впишіть суму курсу');
  if (fin <= 0) return blank('Готівка має бути менша за суму курсу');
  if (!o || isNaN(o.pct) || o.pct < 0 || o.pct >= 100) return blank('Впишіть відсоток');
  const gross = Math.round(fin / ((100 - o.pct) / 100));
  $('r-sel').textContent = `${o.name} · ${num(o.pct)}%` + (cash > 0 ? ` · готівка ${money(cash)}` : '');
  $('r-gross').textContent = money(gross);
  $('r-add').textContent = '+' + money(gross - fin);
  // Комісії банку (лише для кредиту)
  let bankFee = 0, smsMonthly = 0;
  if (o.bank){
    bankFee += Math.round(gross * o.fee / 100);
    if (o.sms.t === 'once') bankFee += o.sms.v;
    else if (o.sms.t === 'month') { bankFee += o.sms.v * o.m; smsMonthly = o.sms.v; }
    else if (o.sms.t === 'pct') bankFee += Math.round(gross * o.sms.v / 100);
  }
  const total = gross + cash + bankFee;
  $('r-total').textContent = money(total);
  // Ліміти, вік, підписання
  let warn = '';
  if (o.bank){
    if (o.max && gross > o.max) warn = `⚠ Сума ${money(gross)} понад ліміт банку ${money(o.max)}`;
    else if (o.min && gross < o.min) warn = `⚠ Мінімальна сума в банку ${money(o.min)}`;
    else if (o.onlineMax && gross > o.onlineMax) warn = `⚠ Понад ${money(o.onlineMax)} — лише офлайн`;
    const parts = [`Вік <b>${o.age}</b>`, o.sign];
    if (bankFee) parts.push(`комісії банку <b>+${money(bankFee)}</b> (вже у «Всього»)`);
    $('r-info').innerHTML = parts.join(' · ');
  }
  $('r-warn').textContent = warn; $('r-warn').hidden = !warn;
  $('r-info').hidden = !o.bank;
  if (o.m){
    const per = gross / o.m + smsMonthly;
    $('r-per').innerHTML = `${money(per)} <small>× ${o.m}</small>`;
    copyText = `${o.label}: ${plat(o.m)} по ${money(per)}` + (cash > 0 ? ` + ${money(cash)} готівкою` : '') + (bankFee ? `, з комісіями банку` : '') + `. Всього ${money(total)}.`;
  } else {
    $('r-per').innerHTML = '<small>вкажіть місяці</small>';
    copyText = `Сума в розтермінування: ${money(gross)}` + (cash > 0 ? ` + ${money(cash)} готівкою` : '') + `. Всього ${money(total)}.`;
  }
}

document.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  selected = c.dataset.id || 'own';
  render();
  if (selected === 'own') setTimeout(() => $('cpct').focus(), 0);
});
['price','cash','cpct','cm'].forEach(id => {
  $(id).addEventListener('input', render);
  $(id).addEventListener('focus', e => setTimeout(() => e.target.select(), 0));
});
['price','cash'].forEach(id => $(id).addEventListener('blur', () => { const v = parse($(id).value); if (!isNaN(v)) $(id).value = v.toLocaleString('uk-UA',{maximumFractionDigits:2}); }));
$('copy').addEventListener('click', () => {
  if (!copyText || !navigator.clipboard) return;
  navigator.clipboard.writeText(copyText).then(() => {
    const b = $('copy'); b.textContent = 'Скопійовано'; b.classList.add('done');
    setTimeout(() => { b.textContent = 'Скопіювати для клієнта'; b.classList.remove('done'); }, 1400);
  }).catch(() => {});
});
$('reset').addEventListener('click', () => {
  ['price','cash','cpct','cm'].forEach(id => $(id).value = '');
  selected = 'p0';
  render();
  window.scrollTo({top:0});
  $('price').focus();
});
render();
</script>
</body>
</html>
