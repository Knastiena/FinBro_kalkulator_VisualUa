<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор зворотного відсотка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark input card on top → tabs (Частинами / Кредит) → one clean list, each row already shows the amount; tap a row to copy */
:root{
  --bg:#eef1f5; --surface:#ffffff; --fg:#141a2b; --muted:#68708a; --line:#e3e7ee;
  --ink:#141a2b; --ink-2:#232b42; --on-ink:#ffffff; --on-ink-muted:#9aa3bd;
  --accent:#0f9f7a; --accent-soft:#e3f5ef; --warn:#c2571b; --warn-soft:#fdf0e7;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131c; --surface:#181d29; --fg:#eef1f7; --muted:#949cb4; --line:#262d3d;
  --ink:#1e2536; --ink-2:#2a3247; --on-ink:#ffffff; --on-ink-muted:#a3abc4;
  --accent:#37c99f; --accent-soft:#163329; --warn:#f0a06a; --warn-soft:#3a2417; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131c; --surface:#181d29; --fg:#eef1f7; --muted:#949cb4; --line:#262d3d;
  --ink:#1e2536; --ink-2:#2a3247; --on-ink:#ffffff; --on-ink-muted:#a3abc4;
  --accent:#37c99f; --accent-soft:#163329; --warn:#f0a06a; --warn-soft:#3a2417; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.35}
.wrap{max-width:540px;margin:0 auto;padding-inline:14px;padding-block:14px 48px;display:grid;gap:14px}

/* hero */
.hero{background:var(--ink);color:var(--on-ink);border-radius:20px;padding:18px 16px 16px;display:grid;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero h1{font-size:1rem;font-weight:700;margin:0;letter-spacing:.01em}
.reset{font:600 .82rem var(--body);background:transparent;color:var(--on-ink-muted);border:1px solid var(--ink-2);border-radius:999px;padding:6px 12px;cursor:pointer}
.reset:hover{color:var(--on-ink)}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inputs > div{min-width:0}
.hero label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--on-ink-muted);margin:0 0 6px 2px}
.field{position:relative}
input{width:100%;font:700 1.35rem/1.2 var(--body);font-variant-numeric:tabular-nums;outline:none;border-radius:14px}
.hero input{color:var(--on-ink);background:var(--ink-2);border:1.5px solid transparent;padding:13px 44px 13px 14px}
.hero input::placeholder{color:#5c6683}
.hero input:focus{border-color:var(--accent)}
.unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:600;font-size:.85rem;color:var(--on-ink-muted)}
.split{display:flex;gap:6px;flex-wrap:wrap;margin:0}
.pill{font-size:.82rem;font-weight:600;background:var(--ink-2);color:var(--on-ink-muted);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums}
.pill b{color:var(--on-ink)}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;position:sticky;top:calc(6px + env(safe-area-inset-top, 0px));z-index:2;box-shadow:0 4px 14px rgba(20,26,43,.06)}
.tabs button{font:600 .9rem var(--body);border:0;background:transparent;color:var(--muted);border-radius:10px;padding:10px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.row:first-child{border-top:0}
.row:hover{background:var(--bg)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.t{font-weight:700;font-size:1rem;min-width:0}
.t .pct{display:inline-block;font-size:.78rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.amt{font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.s{grid-column:1 / -1;display:flex;justify-content:space-between;gap:10px;font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.s b{color:var(--fg);font-weight:600}
.warn{grid-column:1 / -1;justify-self:start;font-size:.78rem;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 8px;margin-top:3px}
.row.off .t,.row.off .amt,.row.off .s{opacity:.45}
.row.done{background:var(--accent-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}


.hint{font-size:.8rem;color:var(--muted);margin:0 4px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);
  font-weight:600;font-size:.9rem;padding:10px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>
<style>body{margin:0}</style>
</head>
<body>

<div class="wrap">
  <section class="hero">
    <div class="hero-top">
      <h1>Калькулятор розтермінування</h1>
      <button class="reset" id="reset">Скинути</button>
    </div>
    <div class="inputs">
      <div>
        <label for="price">Сума курсу</label>
        <div class="field"><input id="price" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">грн</span></div>
      </div>
      <div>
        <label for="cash">Готівка</label>
        <div class="field"><input id="cash" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">грн</span></div>
      </div>
    </div>
    <div class="split" id="split"></div>
  </section>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="parts" aria-selected="true">Частинами</button>
    <button role="tab" data-tab="credit" aria-selected="false">Кредит</button>
  </div>

  <div class="list" id="list"></div>


  <p class="hint">Велика сума — на скільки оформлюємо. Натисніть на рядок, щоб скопіювати текст для клієнта.</p>
</div>
<div class="toast" id="toast" hidden>Скопійовано для клієнта</div>

<script>
// Умови з таблиць банків (Сенс поки не підключений)
const BANK = {
  'Альянс':        {max:250000, sms:{t:'once',v:499}},
  'Юнекс':         {max:100000, sms:{t:'once',v:999}},
  'Плати Пізніше': {min:1000, sms:{t:'none',v:0}},
  'Суперіум':      {min:3000, max:70000, onlineMax:30000, sms:{t:'none',v:0}},
};
const plat = n => { const t=n%10, h=n%100; return n+' '+(t===1&&h!==11?'платіж':(t>=2&&t<=4&&(h<12||h>14)?'платежі':'платежів')); };
const PARTS = Array.from({length:13}, (_, i) => ({pct:i+5, m:i+3, title:plat(i+3), label:'Оплата частинами (Альянс)'}));
const CREDIT = [
  ['Альянс',3,3.5,0],['Юнекс',3,5,1],['Юнекс',5,8,2,{t:'month',v:50}],['Плати Пізніше',5,15,0,{t:'pct',v:2}],['Суперіум',5,15,0],
  ['Альянс',6,7,0],['Альянс',10,11,0],['Юнекс',10,14,6],['Плати Пізніше',10,15,7]
].map(([b,m,pct,fee,sms]) => ({bank:b, m, pct, fee, ...BANK[b], sms: sms || BANK[b].sms, title:`${b} · ${m} міс`, label:`Кредит ${b}`}));

const $ = id => document.getElementById(id);
const parse = s => parseFloat(String(s).replace(/[\s%]/g,'').replace(',', '.'));
const fmt = n => Math.round(n).toLocaleString('uk-UA');
const num = n => n.toLocaleString('uk-UA',{maximumFractionDigits:2});
let tab = 'parts', rows = [];

function vals(){
  const price = parse($('price').value);
  let cash = parse($('cash').value); if (isNaN(cash) || cash < 0) cash = 0;
  return {price, cash, fin: price - cash, ok: !isNaN(price) && price > 0 && price - cash > 0};
}

function calc(o, fin, cash){
  const gross = Math.round(fin / ((100 - o.pct) / 100));
  let fees = 0, smsM = 0;
  if (o.bank){
    fees += Math.round(gross * o.fee / 100);
    if (o.sms.t === 'once') fees += o.sms.v;
    else if (o.sms.t === 'month') { fees += o.sms.v * o.m; smsM = o.sms.v; }
    else if (o.sms.t === 'pct') fees += Math.round(gross * o.sms.v / 100);
  }
  const per = o.m ? gross / o.m + smsM : 0, total = cash + gross + fees;
  let warn = '', off = false;
  if (o.bank){
    if (o.max && gross > o.max){ warn = `Понад ліміт банку ${fmt(o.max)} грн`; off = true; }
    else if (o.min && gross < o.min){ warn = `Мінімум ${fmt(o.min)} грн`; off = true; }
    else if (o.onlineMax && gross > o.onlineMax) warn = 'Лише офлайн';
  }
  const text = o.m
    ? `${o.label}: ${plat(o.m)} по ${fmt(per)} грн` + (cash > 0 ? ` + ${fmt(cash)} грн готівкою` : '') + (fees ? ', з комісіями банку' : '') + `. Всього ${fmt(total)} грн.`
    : `Сума в розтермінування: ${fmt(gross)} грн` + (cash > 0 ? ` + ${fmt(cash)} грн готівкою` : '') + `. Всього ${fmt(total)} грн.`;
  return {gross, per, fees, total, warn, off, text};
}

function rowHtml(o, r, i){
  const pct = `<span class="pct">${num(o.pct)}%</span>`;
  if (!r) return `<button class="row" data-i="${i}"><span class="t">${o.title}${pct}</span><span class="amt">—</span></button>`;
  const left = o.m ? `по <b>${fmt(r.per)} грн</b> × ${o.m}` : 'вкажіть місяці';
  const right = r.fees ? `комісії банку <b>${fmt(r.fees)}</b>` : `всього <b>${fmt(r.total)}</b>`;
  return `<button class="row${r.off?' off':''}" data-i="${i}">
    <span class="t">${o.title}${pct}</span><span class="amt">${fmt(r.gross)} грн</span>
    <span class="s"><span>${left}</span><span>${right}</span></span>
    ${r.warn ? `<span class="warn">⚠ ${r.warn}</span>` : ''}
  </button>`;
}

function render(){
  const {price, cash, fin, ok} = vals();
  $('split').innerHTML = !ok
    ? `<span class="pill">${(!isNaN(price) && price > 0) ? 'Готівка має бути менша за суму курсу' : 'Впишіть суму курсу'}</span>`
    : (cash > 0 ? `<span class="pill">Готівка <b>${fmt(cash)}</b></span>` : '') + `<span class="pill">У розтермінування <b>${fmt(fin)} грн</b></span>`;

  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));

  const opts = tab === 'credit' ? CREDIT : PARTS;
  rows = opts.map(o => ok ? calc(o, fin, cash) : null);
  $('list').innerHTML = opts.map((o,i) => rowHtml(o, rows[i], i)).join('');
}

let tt;
$('list').addEventListener('click', e => {
  const el = e.target.closest('.row'); if (!el) return;
  const r = rows[+el.dataset.i]; if (!r || !navigator.clipboard) return;
  navigator.clipboard.writeText(r.text).then(() => {
    document.querySelectorAll('.row.done').forEach(x => x.classList.remove('done'));
    el.classList.add('done'); $('toast').hidden = false;
    clearTimeout(tt); tt = setTimeout(() => { $('toast').hidden = true; el.classList.remove('done'); }, 1300);
  }).catch(() => {});
});
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; render();
});
['price','cash'].forEach(id => {
  $(id).addEventListener('input', render);
  $(id).addEventListener('focus', e => setTimeout(() => e.target.select(), 0));
});
['price','cash'].forEach(id => $(id).addEventListener('blur', () => { const v = parse($(id).value); if (!isNaN(v)) $(id).value = v.toLocaleString('uk-UA',{maximumFractionDigits:2}); }));
$('reset').addEventListener('click', () => {
  ['price','cash'].forEach(id => $(id).value = '');
  tab = 'parts'; render(); window.scrollTo({top:0}); $('price').focus();
});
render();
</script>
</body>
</html>
