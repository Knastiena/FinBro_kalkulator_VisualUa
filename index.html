<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор зворотного відсотка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column — programme choice, sum, percent, then result with breakdown and programme terms */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --fg:#1b1d2a; --muted:#646a80; --line:#dfe2ea;
  --accent:#5b3fd6; --accent-soft:#ece8fc; --ok:#1f7a4d; --warn:#b4531a; --warn-soft:#fdf0e6;
  --display:"Unbounded", "Manrope", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131a; --surface:#1b1d27; --fg:#eceef5; --muted:#9ba0b4; --line:#2c2f3d;
  --accent:#a593ff; --accent-soft:#2a2545; --ok:#5fd39a; --warn:#f0a36b; --warn-soft:#3a2618; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131a; --surface:#1b1d27; --fg:#eceef5; --muted:#9ba0b4; --line:#2c2f3d;
  --accent:#a593ff; --accent-soft:#2a2545; --ok:#5fd39a; --warn:#f0a36b; --warn-soft:#3a2618; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:grid;gap:20px}
h1{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.25;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:18px}
label,.lbl{display:block;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{font:600 .92rem var(--body);border:0;background:transparent;color:var(--muted);border-radius:9px;padding:9px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
select{width:100%;font:600 1rem var(--body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
select:focus{border-color:var(--accent)}
.field{position:relative}
input{width:100%;font:600 1.4rem/1.2 var(--body);font-variant-numeric:tabular-nums;color:var(--fg);background:var(--bg);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 52px 12px 14px;outline:none}
input:focus{border-color:var(--accent)}
.unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.result{background:var(--accent-soft);border-radius:16px;padding:18px;display:grid;gap:12px}
.result .lbl{margin:0}
.big{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums;word-break:break-word}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.copy{font:600 .9rem var(--body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.copied{color:var(--ok);font-size:.85rem;font-weight:600}
dl{margin:0;display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
dl div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
dt{color:var(--muted)} dd{margin:0;font-weight:600;text-align:right}
.how{font-size:.9rem;color:var(--muted);margin:0}
.how b{color:var(--fg);font-variant-numeric:tabular-nums}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem}
.terms h2{font-family:var(--display);font-size:.95rem;font-weight:500;margin:0}
.terms dl{border-top:0;padding-top:0}
</style>
<style>body{margin:0}</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Вартість курсу зі зворотним відсотком</h1>
    <p class="sub">Оберіть програму або впишіть свій відсоток. Калькулятор покаже ціну для клієнта.</p>
  </header>

  <section class="card">
    <div>
      <span class="lbl">Тип оплати</span>
      <div class="seg" id="seg">
        <button data-mode="parts" aria-pressed="true">Оплата частинами</button>
        <button data-mode="credit" aria-pressed="false">Кредитування</button>
      </div>
    </div>
    <div>
      <label for="prog">Банк і термін</label>
      <select id="prog"></select>
    </div>
    <div>
      <label for="price">Вартість курсу (скільки маємо отримати)</label>
      <div class="field">
        <input id="price" type="text" inputmode="decimal" value="34 200" autocomplete="off">
        <span class="unit">грн</span>
      </div>
    </div>
    <div>
      <label for="pct">Відсоток (можна вписати свій)</label>
      <div class="field">
        <input id="pct" type="text" inputmode="decimal" value="" autocomplete="off" placeholder="напр. 14">
        <span class="unit">%</span>
      </div>
    </div>
  </section>

  <section class="result" aria-live="polite">
    <span class="lbl">Ціна для клієнта</span>
    <div class="big" id="total">—</div>
    <div class="row">
      <button class="copy" id="copyBtn">Скопіювати суму</button>
      <span class="copied" id="copied" hidden>Скопійовано</span>
    </div>
    <div class="alert" id="alert" hidden></div>
    <dl>
      <div><dt>Ціна для клієнта</dt><dd id="d-total">—</dd></div>
      <div><dt>Утримають <span id="d-pct">—</span>%</dt><dd id="d-fee">—</dd></div>
      <div><dt>Отримаємо</dt><dd id="d-net">—</dd></div>
    </dl>
    <p class="how" id="how"></p>
  </section>

  <section class="card terms" id="terms" hidden>
    <h2 id="t-title"></h2>
    <dl id="t-list"></dl>
  </section>
</div>

<script>
// Дані з таблиці «Споживче кредитування» та «Оплата частинами»
const CREDIT = [
  {bank:"Юнекс Банк", m:3,  pct:5,   age:"21–65", sum:"до 100 000 грн", max:100000, fee:"1%",  sms:"999 грн/кд", sign:"онлайн (до 35 т — айді банкінг, від 35 т — Дія підпис) + офлайн"},
  {bank:"Альянс Банк", m:3, pct:3.5, age:"21–65", sum:"до 250 000 грн", max:250000, fee:"0%",  sms:"499 грн/кд", sign:"офлайн + онлайн ОЧ"},
  {bank:"Юнекс Банк", m:5,  pct:8,   age:"21–65", sum:"до 100 000 грн", max:100000, fee:"2%",  sms:"50 грн/м",   sign:"онлайн (до 35 т — айді банкінг, від 35 т — Дія підпис) + офлайн"},
  {bank:"Альянс Банк", m:6, pct:7,   age:"21–65", sum:"до 250 000 грн", max:250000, fee:"0%",  sms:"499 грн/кд", sign:"офлайн + онлайн ОЧ"},
  {bank:"Плати Пізніше", m:5, pct:15, age:"18–75", sum:"від 1 000 грн, без обмежень", min:1000, fee:"0%", sms:"2% від суми", sign:"онлайн (айді банкінг)"},
  {bank:"Суперіум", m:5,    pct:15,  age:"21–65", sum:"3 000–70 000 грн офлайн, 3 000–30 000 грн онлайн", min:3000, max:70000, onlineMax:30000, fee:"0", sms:"немає", sign:"онлайн до 30 т (айді банкінг) + офлайн до 70 т"},
  {bank:"Юнекс Банк", m:10, pct:14,  age:"21–65", sum:"до 100 000 грн", max:100000, fee:"6%",  sms:"999 грн/кд", sign:"онлайн (до 35 т — айді банкінг, від 35 т — Дія підпис) + офлайн"},
  {bank:"Плати Пізніше", m:10, pct:15, age:"18–75", sum:"від 1 000 грн, без обмежень", min:1000, fee:"7%", sms:"немає", sign:"онлайн (айді банкінг)"},
  {bank:"Альянс Банк", m:10, pct:11, age:"21–65", sum:"до 250 000 грн", max:250000, fee:"0%",  sms:"499 грн/кд", sign:"офлайн + онлайн ОЧ"},
];
const PARTS = Array.from({length:13}, (_, i) => ({bank:"Альянс Банк", n:i+3, pct:i+5}));

const $ = id => document.getElementById(id);
const parse = s => parseFloat(String(s).replace(/[\s%]/g,'').replace(',', '.'));
const money = n => n.toLocaleString('uk-UA',{maximumFractionDigits:2}) + ' грн';
const num = n => n.toLocaleString('uk-UA',{maximumFractionDigits:4});
let mode = 'parts';

function fillSelect(){
  const sel = $('prog'); sel.innerHTML = '';
  const custom = new Option('Свій відсоток (вписати вручну)', 'custom');
  if (mode === 'credit'){
    const banks = [...new Set(CREDIT.map(r => r.bank))];
    banks.forEach(b => {
      const g = document.createElement('optgroup'); g.label = b;
      CREDIT.forEach((r, i) => { if (r.bank === b) g.appendChild(new Option(`${b} · ${r.m} міс — ${num(r.pct)}%`, 'c'+i)); });
      sel.appendChild(g);
    });
  } else {
    const g = document.createElement('optgroup'); g.label = 'Альянс Банк';
    PARTS.forEach((r, i) => g.appendChild(new Option(`${r.n} платежів — ${r.pct}%`, 'p'+i)));
    sel.appendChild(g);
  }
  sel.appendChild(custom);
}

function current(){
  const v = $('prog').value;
  if (v[0] === 'c') return {type:'credit', ...CREDIT[+v.slice(1)]};
  if (v[0] === 'p') return {type:'parts', ...PARTS[+v.slice(1)]};
  return null;
}

function onProgChange(){
  const p = current();
  if (p) $('pct').value = num(p.pct);
  calc();
}

function renderTerms(p){
  if (!p){ $('terms').hidden = true; return; }
  $('terms').hidden = false;
  let rows;
  if (p.type === 'credit'){
    $('t-title').textContent = `${p.bank} · ${p.m} міс`;
    rows = [['Компенсація партнера', num(p.pct)+'%'],['Вік клієнта', p.age],['Сума кредиту', p.sum],['Разова комісія', p.fee],['СМС-сервіс', p.sms],['Спосіб підписання', p.sign]];
  } else {
    $('t-title').textContent = `Оплата частинами · ${p.bank}`;
    rows = [['Кількість платежів', p.n],['Компенсація', p.pct+'%']];
  }
  $('t-list').innerHTML = rows.map(([a,b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join('');
}

function calc(){
  const price = parse($('price').value), pct = parse($('pct').value);
  const p = current();
  renderTerms(p);
  $('d-pct').textContent = isNaN(pct) ? '—' : num(pct);
  $('alert').hidden = true;
  if (isNaN(price) || isNaN(pct) || price <= 0 || pct < 0 || pct >= 100){
    $('total').textContent = '—';
    ['d-total','d-fee','d-net'].forEach(i => $(i).textContent = '—');
    $('how').textContent = 'Введіть суму більше 0 і відсоток від 0 до 99.';
    return;
  }
  const k = (100 - pct) / 100;
  const total = Math.round(price / k);
  const fee = total - Math.round(total * k);
  $('total').textContent = money(total);
  $('d-total').textContent = money(total);
  $('d-fee').textContent = money(fee);
  $('d-net').textContent = money(total - fee);
  $('how').innerHTML = `Як рахуємо: 100 − ${num(pct)} = ${num(100-pct)} → ÷ 100 = <b>${num(k)}</b>. Далі ${money(price)} ÷ ${num(k)} = <b>${money(total)}</b>.`;

  if (p && p.type === 'credit'){
    const msgs = [];
    if (p.max && total > p.max) msgs.push(`Сума ${money(total)} більша за ліміт ${p.bank} (${money(p.max)}).`);
    else if (p.onlineMax && total > p.onlineMax) msgs.push(`Понад ${money(p.onlineMax)} у ${p.bank} — лише офлайн.`);
    if (p.min && total < p.min) msgs.push(`Мінімальна сума в ${p.bank} — ${money(p.min)}.`);
    if (msgs.length){ $('alert').textContent = msgs.join(' '); $('alert').hidden = false; }
  }
}

$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode;
  document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  fillSelect(); onProgChange();
});
$('prog').addEventListener('change', onProgChange);
$('price').addEventListener('input', calc);
$('pct').addEventListener('input', () => {
  const p = current();
  if (p && parse($('pct').value) !== p.pct) $('prog').value = 'custom';
  calc();
});
$('price').addEventListener('blur', () => { const v = parse($('price').value); if(!isNaN(v)) $('price').value = v.toLocaleString('uk-UA',{maximumFractionDigits:2}); });
['price','pct'].forEach(id => $(id).addEventListener('focus', e => setTimeout(() => e.target.select(), 0)));
$('copyBtn').addEventListener('click', () => {
  const t = $('total').textContent.replace(/[^\d,]/g,'');
  if (!t) return;
  const done = () => { $('copied').hidden = false; setTimeout(() => $('copied').hidden = true, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(() => {});
});

fillSelect();
$('prog').value = 'p0'; // 3 платежі — приклад
onProgChange();
</script>
</body>
</html>
